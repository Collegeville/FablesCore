name: Update visual baselines

# Run from the Actions tab after an intended change to how the core looks. It takes new
# screenshots on Linux (the platform CI checks on) and opens a pull request with them, so the
# new look is reviewed like any other change.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --update-snapshots
      - name: Open a pull request with the new baselines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard test/visual/baselines)" ]; then
            echo "Baselines are already up to date."
            exit 0
          fi
          branch="visual-baselines-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add test/visual/baselines
          git commit -m "Update visual baselines"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Update visual baselines" \
            --body "New screenshot baselines taken on Linux by the Update visual baselines workflow. Open the Files tab to compare the images before merging."
